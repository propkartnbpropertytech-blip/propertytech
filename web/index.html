    if (self === top) {
      var style = document.getElementById('anti-clickjack-style');
      if (style && style.parentNode) {
        style.parentNode.removeChild(style);
      }
    } else {
      top.location = self.location;
    }
  </script>

  <!-- Accessibility & Lighthouse Viewport Fix -->
  <script type="text/javascript">
    const observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        mutation.addedNodes.forEach(function(node) {
          if (node.nodeName === 'META' && node.getAttribute('name') === 'viewport') {
            const content = node.getAttribute('content');
            if (content && (content.includes('user-scalable=no') || content.includes('maximum-scale=1.0'))) {
              node.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes');
            }
          }
        });
      });
    });
    observer.observe(document.head, { childList: true });

    window.addEventListener('load', function() {
      const viewports = document.querySelectorAll('meta[name="viewport"]');
      viewports.forEach(function(node) {
        const content = node.getAttribute('content');
        if (content && (content.includes('user-scalable=no') || content.includes('maximum-scale=1.0'))) {
          node.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes');
        }
      });
    });
  </script>

  <!-- Fast LCP/FCP Inline Loading Indicator Style -->
  <style>
    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      z-index: 99999;
      opacity: 1;
      transition: opacity 0.3s ease;
    }
    .loader {
      border: 4px solid #1a1a1a;
      border-top: 4px solid #25D366; /* Brand Green */
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    .loading-text {
      color: #ffffff;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Pre-rendering Loader Shell (Instant FCP/LCP Visual Response) -->
  <div id="loading-indicator" class="loading-container">
    <div class="loader"></div>
    <div class="loading-text">Loading PropKart...</div>
  </div>

  <script type="text/javascript">
    // Hide the loader instantly once Flutter starts rendering the canvas/view
    const appObserver = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        mutation.addedNodes.forEach(function(node) {
          if (node.nodeName === 'FLUTTER-VIEW' || node.nodeName === 'FLT-GLASS-PANE') {
            const loader = document.getElementById('loading-indicator');
            if (loader) {
              loader.style.opacity = '0';
              setTimeout(() => loader.remove(), 300);
            }
            appObserver.disconnect();
          }
        });
      });
    });
    appObserver.observe(document.body, { childList: true });
  </script>

  <!-- Web Vitals -> GA4 (via dataLayer) -->
  <script type="module">
    import {onCLS, onINP, onLCP, onFCP, onTTFB} from 'https://unpkg.com/web-vitals@4?module';

    function sendToDataLayer(metric) {
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({
        event: 'web_vitals',
        metric_name: metric.name,
        metric_value: Math.round(metric.name === 'CLS' ? metric.value * 1000 : metric.value),
        metric_id: metric.id,
        metric_rating: metric.rating
      });
    }

    onCLS(sendToDataLayer);
    onINP(sendToDataLayer);
    onLCP(sendToDataLayer);
    onFCP(sendToDataLayer);
    onTTFB(sendToDataLayer);
  </script>
