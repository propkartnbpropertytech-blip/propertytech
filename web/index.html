<!DOCTYPE html>

<head>
  <!-- Anti-Clickjacking Frame Buster -->
  <style id="anti-clickjack-style">
    html { display: none !important; }
  </style>
  <script type="text/javascript">
    if (self === top) {
      var style = document.getElementById('anti-clickjack-style');
      if (style && style.parentNode) {
        style.parentNode.removeChild(style);
      }
    } else {
      top.location = self.location;
    }
  </script>

  <!-- Accessibility & Lighthouse Viewport Fix -->
  <script type="text/javascript">
    const observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        mutation.addedNodes.forEach(function(node) {
          if (node.nodeName === 'META' && node.getAttribute('name') === 'viewport') {
            const content = node.getAttribute('content');
            if (content && (content.includes('user-scalable=no') || content.includes('maximum-scale=1.0'))) {
              node.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes');
            }
          }
        });
      });
    });
    observer.observe(document.head, { childList: true });

    window.addEventListener('load', function() {
      const viewports = document.querySelectorAll('meta[name="viewport"]');
      viewports.forEach(function(node) {
        const content = node.getAttribute('content');
        if (content && (content.includes('user-scalable=no') || content.includes('maximum-scale=1.0'))) {
          node.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes');
        }
      });
    });
  </script>
</head>
<body>

  <!-- Web Vitals -> GA4 (via dataLayer) -->
  <script type="module">
    import {onCLS, onINP, onLCP, onFCP, onTTFB} from 'https://unpkg.com/web-vitals@4?module';

    function sendToDataLayer(metric) {
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({
        event: 'web_vitals',
        metric_name: metric.name,
        metric_value: Math.round(metric.name === 'CLS' ? metric.value * 1000 : metric.value),
        metric_id: metric.id,
        metric_rating: metric.rating
      });
    }

    onCLS(sendToDataLayer);
    onINP(sendToDataLayer);
    onLCP(sendToDataLayer);
    onFCP(sendToDataLayer);
    onTTFB(sendToDataLayer);
  </script>
