  <script type="text/javascript">
    // Chrome allows only a small number of live WebGL contexts. CanvasKit
    // allocates a new one whenever a context is lost and does not release the
    // old OffscreenCanvas, so a single loss becomes a loop: the page stays
    // white and the main thread never finishes loading. Keep GPU rendering,
    // but drop the oldest non-Flutter context before that limit is reached,
    // and do not let that cleanup start another CanvasKit recreation.
    (function () {
      var MAX_WEBGL_CONTEXTS = 8;
      var live = [];
      var suppress = typeof WeakSet === 'function' ? new WeakSet() : null;

      function isWebGLType(type) {
        return type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl';
      }

      function isOffscreen(canvas) {
        return typeof OffscreenCanvas !== 'undefined' && canvas instanceof OffscreenCanvas;
      }

      function isFlutterDisplay(canvas) {
        return !isOffscreen(canvas) && canvas.closest &&
          canvas.closest('flutter-view, flt-glass-pane, flt-canvas-container');
      }

      function rank(entry) {
        if (isFlutterDisplay(entry.canvas)) return 3;
        if (isOffscreen(entry.canvas)) return 2;
        return 0;
      }

      function remember(canvas, gl) {
        var index;
        for (index = live.length - 1; index >= 0; index -= 1) {
          if (live[index].canvas === canvas) live.splice(index, 1);
        }
        live.push({ canvas: canvas, gl: gl });
        while (live.length > MAX_WEBGL_CONTEXTS) {
          var victimIndex = 0;
          for (index = 1; index < live.length; index += 1) {
            if (rank(live[index]) < rank(live[victimIndex])) victimIndex = index;
          }
          var victim = live.splice(victimIndex, 1)[0];
          if (!victim || victim.canvas === canvas) {
            if (victim) live.unshift(victim);
            break;
          }
          try {
            if (suppress) suppress.add(victim.canvas);
            var ext = victim.gl.getExtension('WEBGL_lose_context');
            if (ext) ext.loseContext();
          } catch (error) {}
        }
      }

      function arm(canvas) {
        if (canvas.__propkartWebglArmed) return;
        canvas.__propkartWebglArmed = true;
        canvas.addEventListener('webglcontextlost', function (event) {
          var index;
          for (index = live.length - 1; index >= 0; index -= 1) {
            if (live[index].canvas === canvas) live.splice(index, 1);
          }
          if (suppress && suppress.has(canvas)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      }

      function wrap(prototype) {
        if (!prototype || prototype.__propkartWebglWrapped) return;
        var original = prototype.getContext;
        if (typeof original !== 'function') return;
        prototype.__propkartWebglWrapped = true;
        prototype.getContext = function (type, attributes) {
          if (isWebGLType(type)) arm(this);
          var gl = original.call(this, type, attributes);
          if (isWebGLType(type) && gl) remember(this, gl);
          return gl;
        };
      }

      wrap(HTMLCanvasElement.prototype);
      if (typeof OffscreenCanvas !== 'undefined') wrap(OffscreenCanvas.prototype);
    })();
  </script>

  <!-- Accessibility & Lighthouse Viewport Fix -->
  <script type="text/javascript">
    const observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        mutation.addedNodes.forEach(function(node) {
          if (node.nodeName === 'META' && node.getAttribute('name') === 'viewport') {
            const content = node.getAttribute('content');
            if (content && (content.includes('user-scalable=no') || content.includes('maximum-scale=1.0'))) {
              node.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes');
            }
          }
        });
      });
    });
    observer.observe(document.head, { childList: true });

    window.addEventListener('load', function() {
      const viewports = document.querySelectorAll('meta[name="viewport"]');
      viewports.forEach(function(node) {
        const content = node.getAttribute('content');
        if (content && (content.includes('user-scalable=no') || content.includes('maximum-scale=1.0'))) {
          node.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes');
        }
      });
    });
  </script>

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }
    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      z-index: 99999;
      opacity: 1;
      transition: opacity 0.3s ease;
    }
    .loader {
      border: 4px solid #1a1a1a;
      border-top: 4px solid #25D366; /* Brand Green */
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    .loading-text {
      color: #ffffff;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

  <!-- Pre-rendering Loader Shell (Instant FCP/LCP Visual Response) -->
  <div id="loading-indicator" class="loading-container">
    <div class="loader"></div>
    <div class="loading-text">Loading PropKart...</div>
  </div>

  <script type="text/javascript">
    // Hide the loader instantly once Flutter starts rendering the canvas/view
    const appObserver = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        mutation.addedNodes.forEach(function(node) {
          if (node.nodeName === 'FLUTTER-VIEW' || node.nodeName === 'FLT-GLASS-PANE') {
            const loader = document.getElementById('loading-indicator');
            if (loader) {
              loader.style.opacity = '0';
              setTimeout(() => loader.remove(), 300);
            }
            appObserver.disconnect();
          }
        });
      });
    });
    appObserver.observe(document.body, { childList: true });
  </script>
