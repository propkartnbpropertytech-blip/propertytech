name: Flutter Mobile CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-test:
    name: Flutter Lint, Analyze & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Static Code Analysis & Linting
        run: flutter analyze --no-fatal-infos

      - name: Execute Full Mobile Test Suite (952 Tests)
        run: flutter test

      - name: Build Verification Dry-Run (Web / APK)
        run: |
          echo "Verifying production build assembly..."
          flutter build web --release --dart-define=APP_ENV=production --no-pub
